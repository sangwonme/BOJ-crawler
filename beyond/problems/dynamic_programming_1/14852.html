            <h1>14852. 타일 채우기 3</h1>
<p>2×N 크기의 벽을 2×1, 1×2, 1×1 크기의 타일로 채우는 경우의 수를 구해보자.</p>
<h2>입력</h2>
<p>첫째 줄에 N(1 ≤ N ≤ 1,000,000)이 주어진다.</p>
<h2>출력</h2>
<p>첫째 줄에 경우의 수를 1,000,000,007로 나눈 나머지를 출력한다.</p>
<h2>예제 입출력</h2>
<h3>예제 1</h3>
<p><strong>Input:</strong></p>
<pre><code>1
</code></pre>
<p><strong>Output:</strong></p>
<pre><code>2
</code></pre>
<h3>예제 2</h3>
<p><strong>Input:</strong></p>
<pre><code>2
</code></pre>
<p><strong>Output:</strong></p>
<pre><code>7
</code></pre>
<h3>예제 3</h3>
<p><strong>Input:</strong></p>
<pre><code>3
</code></pre>
<p><strong>Output:</strong></p>
<pre><code>22
</code></pre>
