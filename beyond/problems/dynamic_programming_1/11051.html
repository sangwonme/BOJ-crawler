            <h1>11051. 이항 계수 2</h1>
<p>자연수 \(N\)과 정수 \(K\)가 주어졌을 때 이항 계수 \(\binom{N}{K}\)를 10,007로 나눈 나머지를 구하는
프로그램을 작성하시오.</p>
<h2>입력</h2>
<p>첫째 줄에 \(N\)과 \(K\)가 주어진다. (1 ≤ \(N\) ≤ 1,000, 0 ≤ \(K\) ≤ \(N\))</p>
<h2>출력</h2>
<p>\(\binom{N}{K}\)를 10,007로 나눈 나머지를 출력한다.</p>
<h2>예제 입출력</h2>
<h3>예제 1</h3>
<p><strong>Input:</strong></p>
<pre><code>5 2
</code></pre>
<p><strong>Output:</strong></p>
<pre><code>10
</code></pre>
