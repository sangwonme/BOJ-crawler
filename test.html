\n    <!DOCTYPE html>\n    <html lang="ko">\n    <head>\n        <meta charset="UTF-8">\n        <title>Document</title>\n        <style>\n            body {\n                font-family: \'Arial\', sans-serif;\n                margin: 40px;\n                background-color: #ffffff; /* White background */\n                color: #333366; /* Dark blue text */\n            }\n            h1, h2 {\n                color: #104061; /* Vibrant blue for headings */\n                font-size: 30px;\n                border-bottom: 1px solid #6f8695;\n                border-top: 3px solid #6f8695;\n                padding: 10px 0;\n            }\n            h2 {\n                font-size: 20px;\n            }\n            p {\n                font-size: 16px;\n                line-height: 1.6;\n            }\n            a {\n                color: #6699ff; /* Lighter blue for links */\n                text-decoration: none;\n            }\n            a:hover {\n                text-decoration: underline;\n            }\n            table {\n                width: 100%;\n                border-collapse: collapse;\n            }\n            th, td {\n                padding: 8px;\n                text-align: left;\n                border-bottom: 1px solid #ddd;\n            }\n            th {\n                background-color: #cce6ff; /* Light blue for table headers */\n            }\n            code{\n                display: block;\n                padding: 20px;\n                border-radius: 5px;\n                background-color: #eeeae6;\n            }\n            img{\n                display: block;\n                height: 140px;\n                margin: 0 auto;\n            }\n        </style>\n    </head>\n    <body>\n        <h1>A+B ★☆☆</h1>\n<p>두 정수 A와 B를 입력받은 다음, A+B를 출력하는 프로그램을 작성하시오.</p>\n<h2>입력</h2>\n<p>첫째 줄에 A와 B가 주어진다. (0 &lt; A, B &lt; 10)</p>\n<h2>출력</h2>\n<p>첫째 줄에 A+B를 출력한다.</p>\n<h2>예제 입력 1</h2>\n<pre><code>1 2\n</code></pre>\n<h2>예제 출력 1</h2>\n<pre><code>3\n</code></pre>\n    </body>\n    </html>\n
